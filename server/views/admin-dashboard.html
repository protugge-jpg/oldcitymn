<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Old City Mongolia</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            background: #f7f1e8;
        }

        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin: 0;
            color: #987654;
        }

        .logout-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filters label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .filter-actions button {
            background: linear-gradient(135deg, #987654, #7a5d47);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #987654;
        }

        .status-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            background: #f5ede0;
            color: #333;
        }

        .badge.payment-paid {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge.payment-arrival {
            background: #fff4e5;
            color: #b26a00;
        }

        .badge.method-online {
            background: #ede7f6;
            color: #5e35b1;
        }

        .badge.method-arrival {
            background: #e3f2fd;
            color: #1565c0;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Booking Dashboard</h1>
            <form method="POST" action="/admin/logout">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>

        <div class="filters">
            <div>
                <label for="filterType">Booking Type</label>
                <select id="filterType">
                    <option value="">All</option>
                    <option value="room">Room</option>
                    <option value="trip">Trip</option>
                </select>
            </div>
            <div>
                <label for="filterFrom">From Date</label>
                <input type="date" id="filterFrom">
            </div>
            <div>
                <label for="filterTo">To Date</label>
                <input type="date" id="filterTo">
            </div>
            <div class="filter-actions">
                <button type="button" onclick="loadBookings()">Apply Filters</button>
                <button type="button" onclick="resetFilters()">Reset</button>
            </div>
        </div>

        <div id="tableWrapper">
            <table id="bookingsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Guest</th>
                        <th>Type</th>
                        <th>Details</th>
                        <th>Dates</th>
                        <th>Guests</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Booked At</th>
                        <th>Status</th>
                        <th>Update</th>
                    </tr>
                </thead>
                <tbody id="bookingsBody"></tbody>
            </table>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">No bookings found.</div>
    </div>

    <script>
        async function loadBookings() {
            const type = document.getElementById('filterType').value;
            const from = document.getElementById('filterFrom').value;
            const to = document.getElementById('filterTo').value;

            const params = new URLSearchParams();
            if (type) params.append('type', type);
            if (from) params.append('from', from);
            if (to) params.append('to', to);

            const res = await fetch(`/api/admin/bookings?${params.toString()}`);
            if (!res.ok) {
                return;
            }
            const data = await res.json();
            renderTable(data);
        }

        function renderTable(bookings) {
            const body = document.getElementById('bookingsBody');
            const emptyState = document.getElementById('emptyState');
            body.innerHTML = '';

            if (!bookings.length) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            bookings.forEach(booking => {
                const tr = document.createElement('tr');
                const dates = booking.bookingType === 'room'
                    ? `${booking.checkInDate} → ${booking.checkOutDate}`
                    : `Start: ${booking.startDate}`;
                const guests = booking.bookingType === 'room'
                    ? `Beds: ${booking.beds || 1}`
                    : `Group: ${booking.participants || 1}`;
                const details = booking.bookingType === 'room'
                    ? `${booking.roomType ? booking.roomType.toUpperCase() : 'ROOM'}`
                    : `${booking.tripType ? booking.tripType.toUpperCase() : 'TRIP'}`;
                const bookedAt = booking.createdAt
                    ? new Date(booking.createdAt).toLocaleString()
                    : '-';
                const paymentMethodLabel = booking.paymentMethod === 'pay_in_person' ? 'Pay in Person' : 'Pay Online';
                const paymentStatusLabel = booking.paymentMethod === 'pay_in_person' ? 'Pay on Arrival' : 'Paid';
                const paymentMethodClass = booking.paymentMethod === 'pay_in_person' ? 'method-arrival' : 'method-online';
                const paymentStatusClass = booking.paymentMethod === 'pay_in_person' ? 'payment-arrival' : 'payment-paid';

                tr.innerHTML = `
                    <td>#${booking.id}</td>
                    <td>${booking.guestName}<br><span class="badge">${booking.guestEmail}</span></td>
                    <td>${booking.bookingType.toUpperCase()}</td>
                    <td>${details}</td>
                    <td>${dates}</td>
                    <td>${guests}</td>
                    <td>$${Number(booking.amount || 0).toFixed(2)}</td>
                    <td>
                        <span class="badge ${paymentMethodClass}">${paymentMethodLabel}</span><br>
                        <span class="badge ${paymentStatusClass}">${paymentStatusLabel}</span>
                    </td>
                    <td>${bookedAt}</td>
                    <td>
                        <select class="status-select" data-id="${booking.id}">
                            <option value="confirmed" ${booking.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="completed" ${booking.status === 'completed' ? 'selected' : ''}>Completed</option>
                            <option value="canceled" ${booking.status === 'canceled' ? 'selected' : ''}>Canceled</option>
                        </select>
                    </td>
                    <td><button onclick="updateStatus(${booking.id})">Save</button></td>
                `;
                body.appendChild(tr);
            });
        }

        async function updateStatus(id) {
            const select = document.querySelector(`select[data-id="${id}"]`);
            const status = select.value;

            await fetch(`/api/admin/bookings/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });

            loadBookings();
        }

        function resetFilters() {
            document.getElementById('filterType').value = '';
            document.getElementById('filterFrom').value = '';
            document.getElementById('filterTo').value = '';
            loadBookings();
        }

        loadBookings();
    </script>
</body>
</html>
